# ===================================================================
# Spring Boot Configuration File (application.yml)
# Production Rule: Clear, structured configuration with comments
# ===================================================================

server:
  port: 8080 # Backend Server Port

spring:
  application:
    name: wallet-order-management-system

  # -----------------------------------------------------------------
  # Database Configuration (H2 In-Memory for Zero-Friction Setup)
  # Isse bina MySQL install kiye instant run ho jata hai.
  # Production me bas URL, username, password MySQL/PostgreSQL ka dalna hota hai.
  # -----------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:wallet_order_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  # -----------------------------------------------------------------
  # H2 Web Console:
  # Browser me http://localhost:8080/h2-console khol kar aap
  # live database tables, users, wallet balance aur orders dekh sakte hain!
  # -----------------------------------------------------------------
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # -----------------------------------------------------------------
  # Spring Data JPA & Hibernate Configuration
  # -----------------------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 'update': Tables automatically create/update hongi bina data wipe huye
      ddl-auto: update
    show-sql: true # Console me generated SQL queries print hongi (Learning ke liye best)
    properties:
      hibernate:
        format_sql: true # SQL queries beautiful format me print hongi

# -----------------------------------------------------------------
# Swagger / OpenAPI Documentation
# Browser me http://localhost:8080/swagger-ui.html khol kar
# aap sari APIs ko direct UI se test kar sakte hain!
# -----------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
